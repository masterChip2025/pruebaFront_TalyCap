<div class="container">
  <header>
    <h1>🎬 Dashboard Público Angular 18</h1>
  </header>

  <!-- Spinner de Carga -->
  @if (isLoading) {
    <div class="spinner-container">
      <mat-spinner diameter="50"></mat-spinner>
    </div>
  } @else {
    <table mat-table [dataSource]="movieDataSource">
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Título</th>
        <td mat-cell *matCellDef="let movie">{{ movie.title }}</td>
      </ng-container>

      <ng-container matColumnDef="releaseDate">
        <th mat-header-cell *matHeaderCellDef>Fecha</th>
        <td mat-cell *matCellDef="let movie">{{ movie.releaseDate }}</td>
      </ng-container>

      <ng-container matColumnDef="rating">
        <th mat-header-cell *matHeaderCellDef>Rating</th>
        <td mat-cell *matCellDef="let movie">{{ movie.rating }}</td>
      </ng-container>

      <ng-container matColumnDef="poster">
        <th mat-header-cell *matHeaderCellDef>Póster</th>
        <td mat-cell *matCellDef="let movie"><img [src]="movie.poster" /></td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="movieColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: movieColumns"></tr>
    </table>
